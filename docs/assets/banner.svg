<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Counterprompt</title>
  <desc id="desc">Counterprompt logo: a square labyrinth with a prompt caret at its center. A terminal shows an AI attacker being flagged and routed into the Labyrinth.</desc>
  <defs>
    <linearGradient id="cpb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12203F"/>
      <stop offset=".55" stop-color="#0A1226"/>
      <stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="cpb-maze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="cpb-glow" cx=".2" cy=".35" r=".6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cpb-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7DD3FC" fill-opacity=".09"/>
    </pattern>
    <clipPath id="cpb-clip"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#cpb-clip)">
    <rect width="1280" height="400" fill="url(#cpb-bg)"/>
    <rect width="1280" height="400" fill="url(#cpb-dots)"/>
    <rect width="1280" height="400" fill="url(#cpb-glow)"/>
  </g>
  <rect x="1" y="1" width="1278" height="398" rx="23" fill="none" stroke="#7DD3FC" stroke-opacity=".18" stroke-width="2"/>

  <!-- mark -->
  <g transform="translate(72 64)">
    <rect width="112" height="112" rx="26" fill="#0B1428" stroke="#7DD3FC" stroke-opacity=".25" stroke-width="2"/>
    <g transform="scale(.875)">
      <path d="M44 24 H104 V104 H24 V40 H88 V88 H40 V64 H56" fill="none" stroke="url(#cpb-maze)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="63" y="54" width="10" height="20" rx="2" fill="#F59E0B"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="70" y="262" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#F8FAFC">counter<tspan fill="#7DD3FC">prompt</tspan></text>
  <text x="72" y="308" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#A5B4CF">Turn prompt injection into a defense against AI attackers.</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">
    <rect x="72" y="334" width="128" height="30" rx="15" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".45"/>
    <text x="136" y="354" text-anchor="middle" fill="#FCD34D">canary traps</text>
    <rect x="210" y="334" width="128" height="30" rx="15" fill="#3B82F6" fill-opacity=".14" stroke="#60A5FA" stroke-opacity=".5"/>
    <text x="274" y="354" text-anchor="middle" fill="#93C5FD">llm labyrinth</text>
    <rect x="348" y="334" width="128" height="30" rx="15" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".45"/>
    <text x="412" y="354" text-anchor="middle" fill="#67E8F9">ai analyst</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(724 56)">
    <rect width="492" height="288" rx="16" fill="#050811" fill-opacity=".86" stroke="#7DD3FC" stroke-opacity=".2" stroke-width="1.5"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 H476 a16 16 0 0 1 16 16 V40 H0 Z" fill="#0E1730"/>
    <circle cx="24" cy="20" r="5.5" fill="#F87171"/><circle cx="42" cy="20" r="5.5" fill="#FBBF24"/><circle cx="60" cy="20" r="5.5" fill="#34D399"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
      <text x="246" y="25" text-anchor="middle" fill="#64748B" font-size="12.5">counterprompt · live feed</text>
      <text x="24" y="76" fill="#94A3B8">GET</text><text x="76" y="76" fill="#E2E8F0">/debug</text><text x="276" y="76" fill="#64748B" font-weight="400">passthrough</text>
      <text x="24" y="104" fill="#94A3B8">POST</text><text x="76" y="104" fill="#E2E8F0">/admin</text><text x="276" y="104" fill="#64748B" font-weight="400">passthrough</text>
      <text x="24" y="132" fill="#94A3B8">GET</text><text x="76" y="132" fill="#E2E8F0">/internal/</text><text x="276" y="132" fill="#FBBF24" font-weight="700">trap → flagged</text>
      <text x="24" y="160" fill="#94A3B8">GET</text><text x="76" y="160" fill="#E2E8F0">/.env</text><text x="276" y="160" fill="#60A5FA" font-weight="400">labyrinth · depth 6</text>
      <text x="24" y="188" fill="#94A3B8">GET</text><text x="76" y="188" fill="#E2E8F0">/backup/users.sql</text><text x="276" y="188" fill="#60A5FA" font-weight="400">labyrinth · depth 8</text>
      <text x="24" y="216" fill="#94A3B8">AUTH</text><text x="76" y="216" fill="#E2E8F0">svc_backup_154f</text><text x="276" y="216" fill="#F87171" font-weight="700">honeytoken reuse</text>
      <line x1="24" y1="236" x2="468" y2="236" stroke="#1E293B"/>
      <text x="24" y="264" fill="#67E8F9">analyst</text><text x="104" y="264" fill="#94A3B8">goal: credential discovery</text><text x="468" y="264" text-anchor="end" fill="#FBBF24" font-weight="700">68%</text>
    </g>
  </g>
</svg>
